<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDS-04 抛弃式工作台比较</title>
<style>
  :root { font: 15px/1.5 system-ui,sans-serif; color:#24303b; background:#e8edf1 }
  * { box-sizing:border-box } body { margin:0 } button,select { font:inherit; cursor:pointer }
  button { background:#fff; color:inherit; border:1px solid #a5b2bd; border-radius:5px; padding:5px 10px }
  button:focus-visible,select:focus-visible { outline:3px solid #1768be; outline-offset:2px }
  button[aria-pressed=true] { background:#1768be; color:white }
  header { background:#243e58; color:white; padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap }
  header strong { margin-right:auto } header select { padding:5px; max-width:165px }
  .notice { padding:5px 16px; background:#ffe8a1; font-size:13px }
  .workspace { display:grid; min-height:calc(100vh - 190px); gap:8px; padding:8px }
  .panel { border:1px solid #adbac5; background:#fff; border-radius:5px; padding:12px; min-width:0; overflow:auto }
  .panel h2 { font-size:16px; margin:0 0 9px } .panel h3 { font-size:14px; margin:12px 0 4px }
  .muted { color:#5a6570 } .chips { display:flex; gap:5px; flex-wrap:wrap }
  .chip { padding:2px 7px; background:#ecf2f8; border-radius:12px; font-size:12px }
  .nav button,.commands button { display:block; margin:6px 0; width:100%; text-align:left }
  .body { border-left:3px solid #6594be; padding:12px 16px; background:#f3f7fa; min-height:170px }
  .region { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 }
  .state { padding:10px 16px 70px; background:#fff; border-top:1px solid #a5b2bd; font:12px/1.5 ui-monospace,monospace; white-space:pre-wrap }
  .switcher { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:9px; align-items:center; background:#142e46; color:white; padding:7px; border-radius:25px; box-shadow:0 4px 16px #0005; z-index:9 }
  .switcher button { border-radius:18px; min-width:36px }
  .A { grid-template-columns:205px minmax(330px,1fr) 260px; grid-template-areas:'nav main inspector' 'nav graph inspector' 'commands main status' }
  .B { grid-template-columns:190px minmax(330px,1fr) auto; grid-template-rows:1fr auto; grid-template-areas:'nav main inspector' 'commands graph status' }
  .C { display:flex; flex-wrap:wrap; align-content:flex-start }
  .C .panel { flex:1 1 270px; min-height:190px } .C .main { flex:2 1 460px; min-height:420px }
  .nav { grid-area:nav }.main { grid-area:main }.inspector { grid-area:inspector }
  .graph { grid-area:graph }.commands { grid-area:commands }.status { grid-area:status }
  .B .inspector { width:260px }.B .graph { max-height:125px }
  .B.focus .nav,.B.focus .graph,.B.focus .commands { display:none }
  .B.focus { grid-template-columns:minmax(330px,1fr) auto; grid-template-areas:'main inspector' 'main status' }
  .workspace.narrow { display:flex; flex-direction:column }
  .workspace.narrow .nav,.workspace.narrow .inspector,.workspace.narrow .graph,.workspace.narrow .commands { display:none }
  .workspace.narrow .main { min-height:360px; order:1 }.workspace.narrow .status { order:2 }
  .workspace.narrow .panel.revealed { display:block; order:3 }
  .workspace.focus:not(.B) .nav,.workspace.focus:not(.B) .graph,.workspace.focus:not(.B) .commands { display:none }
  .workspace.focus:not(.B) .main { flex:3 }
  @media(max-width:760px) { .workspace:not(.narrow) { display:flex; flex-direction:column } .workspace:not(.narrow) .panel { min-height:auto } }
</style>
<header>
  <strong>EDS-04 · 抛弃式原型</strong>
  <label>任务 <select id="task"><option value="world">J1 世界资料</option><option value="writing">J2 写作旁查</option><option value="run">J3 演练</option><option value="review">J4 审阅</option></select></label>
  <button id="narrow">窄窗模拟</button><button id="focus">专注</button><button id="readonly">切换只读</button><button id="reset">重置个人布局</button>
</header>
<div class="notice">示例数据仅在内存中运行；没有 Project 写入。书稿、审阅队列和重放内容属于假数据。</div>
<section id="workspace" class="workspace B">
  <aside class="panel nav"><h2>导航</h2><div class="navlinks"></div><button data-show="nav">恢复导航</button></aside>
  <main class="panel main"><h2 id="main-title"></h2><div class="body" id="main-body"></div><div class="region"><button id="select-a">选择 A</button><button id="select-b">选择 B</button><button id="pin">固定/解除 B</button></div><div class="region"><button id="draft">输入 A 草稿</button><button id="stale">模拟外部刷新</button><button id="apply">尝试应用草稿</button></div></main>
  <aside class="panel inspector"><h2>检查器 <span id="inspector-owner"></span></h2><p id="inspector-body"></p><button id="locate">定位检查对象</button></aside>
  <aside class="panel graph"><h2>时间 / 图</h2><p id="graph-body"></p><button id="preview">预览事件 E</button></aside>
  <aside class="panel commands"><h2>资源 / 命令</h2><button id="drawer">打开/关闭资源抽屉</button><div id="drawer-content" hidden>资料 B · place:b<br>同名候选必须按 kind+ID 区分。<button id="drawer-close">关闭，不提交</button></div><button id="run">显式运行一步</button><button id="save">保存示意（无实际写入）</button></aside>
  <aside class="panel status"><h2>状态 / 诊断</h2><p id="status-body"></p><div class="region"><button data-show="inspector">检查器</button><button data-show="nav">导航</button><button data-show="graph">图</button><button data-show="commands">资源</button></div></aside>
</section>
<div class="state" id="state"></div>
<div class="switcher"><button id="prev" aria-label="上一方案">←</button><span id="variant-label"></span><button id="next" aria-label="下一方案">→</button></div>
<script>
// EDS-04 一次性布局比较。三种结构共用数据和交互，不连接生产项目。
const names={A:'固定三栏',B:'稳定外壳 + 任务预设',C:'自由分区'};
const tasks={
  world:['地图与资料','资料 B（place:b）与地图入口 P（map:harbor/placement:p）是不同 owner。锁层时修改禁用。','地图主投影；时间图按需切换。'],
  writing:['正文 A · 旁查 B','“白塔议会……” 光标在第 7 字。固定 B 后选择 A，检查器仍显示 B；关闭旁查返回原句。','写作时图默认隐藏。'],
  run:['事件 E · 演练解释','选择 E 只定位定义。预览分支不推进运行位置；只有“显式运行一步”改变本地示意 runtime。','世界偏序与本次运行路径分开。'],
  review:['提案 R · 三方对照','原稿 / 提案 / 结果并列；外部刷新使旧基线失效，解决草稿保留等待重新比较。','审阅时隐藏时间图。']
};
const s={variant:new URLSearchParams(location.search).get('variant')||'B',task:'world',selection:'A',pin:false,draft:false,stale:false,conflict:false,focus:false,focusReturn:null,narrow:false,readOnly:false,drawer:false,runtime:'start',preview:'none',revealed:''};
if(!names[s.variant])s.variant='B';
const $=id=>document.getElementById(id), w=$('workspace');
function render(){
  w.className='workspace '+s.variant+(s.focus?' focus':'')+(s.narrow?' narrow':'');
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('revealed',p.classList.contains(s.revealed)));
  $('task').value=s.task; $('variant-label').textContent=s.variant+' — '+names[s.variant];
  $('main-title').textContent=tasks[s.task][0]; $('main-body').textContent=tasks[s.task][1]; $('graph-body').textContent=tasks[s.task][2];
  $('inspector-owner').textContent=s.pin?'已固定：B / place:b':'跟随：'+s.selection;
  $('inspector-body').textContent=s.pin?'B 的资料；选择 A 不改变本面板编辑 owner。':'当前选择 '+s.selection+'；任何编辑需显式确认 owner。';
  $('status-body').textContent='owner: '+(s.pin?'B':s.selection)+' ｜ A 草稿: '+(s.draft?'未应用':'无')+' ｜ 基线: '+(s.stale?'已失效':'当前')+' ｜ '+(s.readOnly?'只读：不能应用':'可写')+' ｜ runtime: '+s.runtime+' ｜ 预览: '+s.preview;
  $('apply').disabled=s.readOnly;
  $('drawer-content').hidden=!s.drawer;
  $('state').textContent='task='+s.task+'  view='+tasks[s.task][0]+'  selection='+s.selection+'  pin='+s.pin+'  draft='+s.draft+'  capability='+(s.readOnly?'read-only':'editable')+'  space='+(s.narrow?'narrow':s.focus?'focus':'wide')+'\nvariant='+s.variant+'  stale='+s.stale+'  conflict='+s.conflict+'  drawer='+s.drawer+'  revealed='+s.revealed+'  preview_cursor='+s.preview+'  runtime_position='+s.runtime+'\nProject writes=0 (prototype)';
  history.replaceState(null,'','?variant='+s.variant);
}
function variant(delta){const v=Object.keys(names);s.variant=v[(v.indexOf(s.variant)+delta+v.length)%v.length];render()}
$('prev').onclick=()=>variant(-1);$('next').onclick=()=>variant(1);
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')variant(-1);if(e.key==='ArrowRight')variant(1)});
$('task').onchange=e=>{if(s.draft&&!confirm('A 有未应用草稿。保留草稿并切换任务？')){render();return}s.task=e.target.value;render()};
$('narrow').onclick=()=>{s.narrow=!s.narrow;render()};
$('focus').onclick=()=>{
  if(!s.focus){s.focusReturn={id:document.activeElement.id,scroll:document.querySelector('.main').scrollTop};s.focus=true;render()}
  else {s.focus=false;render();if(s.focusReturn){document.querySelector('.main').scrollTop=s.focusReturn.scroll;$(s.focusReturn.id)?.focus();s.focusReturn=null}}
};
$('readonly').onclick=()=>{s.readOnly=!s.readOnly;render()};
$('reset').onclick=()=>{s.focus=false;s.narrow=false;s.revealed='';render()};
$('select-a').onclick=()=>{s.selection='A';render()};$('select-b').onclick=()=>{s.selection='B';render()};$('pin').onclick=()=>{s.pin=!s.pin;render()};
$('draft').onclick=()=>{s.draft=true;render()};$('stale').onclick=()=>{s.stale=true;render()};
$('apply').onclick=()=>{if(s.stale){s.conflict=true;alert('基线已失效：保留 A 草稿，需重新比较。')}else if(s.draft){s.draft=false;alert('示意：应用到缓冲；本原型未写 Project。')}render()};
$('drawer').onclick=()=>{s.drawer=!s.drawer;render()};$('drawer-close').onclick=()=>{s.drawer=false;render()};
$('preview').onclick=()=>{s.preview='E';render()};$('run').onclick=()=>{s.runtime='E';render()};
$('save').onclick=()=>alert('原型无持久化；生产产品需区分应用缓冲与保存到文件。');
$('locate').onclick=()=>{s.selection=s.pin?'B':s.selection;render()};
document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{s.revealed=b.dataset.show;render()});
document.querySelector('.navlinks').innerHTML='<button>资料 B · place:b</button><button>地图入口 P</button><button>事件 E</button><button>提案 R（样例）</button>';
render();
</script>
</html>
