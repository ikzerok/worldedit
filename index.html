<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="worldedit 世界创作工作台，与桌面版共用 Rust 界面与语言核心。">
  <title>worldedit · worldline 作者工作台</title>
  <link data-trunk rel="rust" data-bin="worldedit" data-wasm-opt="0">
  <link data-trunk rel="icon" href="assets/worldedit-icon.png">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #16171b; color: #edeff5; }
    #worldedit-canvas { display: block; width: 100%; height: 100%; min-width: 1040px; min-height: 660px; touch-action: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; font: 16px/1.8 system-ui, sans-serif; padding: 24px; }
    #loading strong { color: #8fb7f8; font-size: 24px; }
  </style>
</head>
<body>
  <canvas id="worldedit-canvas" aria-label="worldedit 世界创作工作台"></canvas>
  <div id="loading" role="status"><strong>worldedit</strong>正在加载世界创作工作台…</div>
  <noscript>请启用 JavaScript 以加载 Rust WebAssembly 工作台。</noscript>
</body>
</html>
