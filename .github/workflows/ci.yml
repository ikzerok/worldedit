name: worldedit
on: [push, pull_request]
# 只合并同事件的工作分支CI；main/release等事件使用唯一run_id，连pending也不互相替换。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/work/')) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'work/') && !startsWith(github.base_ref, 'release/'))) && (github.event.pull_request.number || github.ref) || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/work/')) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'work/') && !startsWith(github.base_ref, 'release/')) }}
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: worldedit
    steps:
      - uses: actions/checkout@v4
        with:
          path: worldedit
      - name: 读取固定配对
        id: pair
        run: |
          $pair = Get-Content compatibility.json -Raw | ConvertFrom-Json
          if ($pair.worldline.repository -ne 'ikzerok/worldline' -or $pair.worldline.sha -cnotmatch '^[0-9a-f]{40}$') {
            throw '兼容记录必须指定 worldline 仓库和完整提交 SHA'
          }
          "repository=$($pair.worldline.repository)" >> $env:GITHUB_OUTPUT
          "sha=$($pair.worldline.sha)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pair.outputs.repository }}
          ref: ${{ steps.pair.outputs.sha }}
          path: worldline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 配对脚本离线测试
        run: |
          python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s scripts -p 'test_check_pair.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 发行门禁离线测试
        run: |
          python -X warn_default_encoding -W error::EncodingWarning scripts/release-test.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 安装仓库工具链
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 安装固定 Trunk 官方预编译文件
        run: |
          python scripts/install-trunk.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 核对固定 Trunk 路径与版本
        run: |
          python scripts/install-trunk.py --verify-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 配对构建与回归
        run: ./scripts/check-pair.ps1
