name: 恢复既有 v0.3.1 发行
on:
  create:
permissions:
  contents: read
concurrency:
  group: official-release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'ikzerok/worldedit' &&
      github.event.ref_type == 'branch' &&
      github.event.ref == 'release/recover-v0.3.1-399987295'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 有界恢复离线回归
        run: python -X warn_default_encoding -W error::EncodingWarning scripts/release-recover-test.py
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '11094220457'
          run-id: '36707894610'
          github-token: ${{ github.token }}
          repository: ikzerok/worldedit
          merge-multiple: true
          path: release-assets
      - name: 核对固定草稿及已构建资产，回读后公开
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release-recover.py
