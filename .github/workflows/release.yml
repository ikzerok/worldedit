name: 正式发行
# 首次创建走 create；已有发行分支的非强制快进 push 仅用于未发布失败的受控重试。
on:
  create:
  push:
    branches: ['release/v0.*.*']
permissions:
  contents: read
concurrency:
  group: official-release
  cancel-in-progress: false
jobs:
  gate:
    if: >-
      github.repository == 'ikzerok/worldedit' &&
      ((github.event_name == 'create' && github.event.ref_type == 'branch' &&
        startsWith(github.event.ref, 'release/v')) ||
       (github.event_name == 'push' && github.event.created == false &&
        github.event.deleted == false && github.event.forced == false &&
        startsWith(github.ref, 'refs/heads/release/v0.') &&
        github.event.ref == github.ref && github.event.after == github.sha))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      editor_sha: ${{ steps.gate.outputs.editor_sha }}
      core_sha: ${{ steps.gate.outputs.core_sha }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 离线门禁回归
        run: python scripts/release-test.py -v
      - name: Windows 产物核验器离线测试
        run: python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s scripts -p 'test*windows*.py' -v
      - name: 桌面发行文档链接映射测试
        run: python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s scripts -p 'test_package_doc_links.py' -v
      - name: 检查版本、双仓 main、CI 和所有工单
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py gate
      - uses: actions/upload-artifact@v4
        with:
          name: release-gate
          path: release-pair.json
          if-no-files-found: error
          retention-days: 14
  build:
    needs: gate
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.editor_sha }}
          path: worldedit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ikzerok/worldline
          ref: ${{ needs.gate.outputs.core_sha }}
          path: worldline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-gate
          path: gate
      - name: 安装固定工具链与 Trunk
        working-directory: worldedit
        shell: pwsh
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add wasm32-unknown-unknown
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/install-trunk.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 固定提交快照打包与离线核验
        shell: pwsh
        run: |
          python worldedit/scripts/install-trunk.py --verify-path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python worldedit/scripts/release-build.py --editor worldedit --core worldline --pair gate/release-pair.json --output release-assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.editor_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: 重查门禁，创建 draft，回读全部附件后公开
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py publish --directory release-assets
