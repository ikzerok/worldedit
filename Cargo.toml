[package]
name = "worldedit"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "worldedit:worldline 的作者工作台(egui)"

[features]
eds11_prototype = []

[dependencies]
worldline-core = { path = "../worldline/core" }
worldline-runtime = { path = "../worldline/runtime" }
eframe = "0.32"
egui = "0.32"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "File", "FileList", "HtmlInputElement", "HtmlAnchorElement", "BeforeUnloadEvent", "Storage", "Url", "Location"] }
